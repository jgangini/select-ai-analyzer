name: Validate Terraform

on:
  pull_request:
    paths:
      - "terraform/**"
      - "deploy/hooks/**"
      - "tests/test_post_apply.py"
      - "apps/**"
      - "tests/test_deploy_studio_contract.py"
      - ".github/workflows/terraform.yml"
  push:
    branches:
      - main
    tags:
      - "v*"
    paths:
      - "terraform/**"
      - "deploy/hooks/**"
      - "tests/test_post_apply.py"
      - "apps/**"
      - "tests/test_deploy_studio_contract.py"
      - ".github/workflows/terraform.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      TF_IN_AUTOMATION: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8

      - name: Validate Deploy Studio contract
        run: python -m unittest discover -s tests -p 'test_deploy_studio_contract.py' -v

      - name: Check Terraform formatting
        run: terraform fmt -check -recursive terraform

      - name: Initialize Terraform
        run: terraform -chdir=terraform init -backend=false -input=false

      - name: Validate Terraform
        run: terraform -chdir=terraform validate

      - name: Test new and existing database plans with mock providers
        run: terraform -chdir=terraform test

  application:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/backend/requirements*.txt

      - name: Test the backend and Deploy Studio hook
        run: |
          python -m pip install -r apps/backend/requirements-dev.txt
          python -m pytest
          python -m unittest discover -s tests -v

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/frontend/package-lock.json

      - name: Test and build the frontend
        working-directory: apps/frontend
        run: |
          npm ci
          npm run test:run
          npm run build
