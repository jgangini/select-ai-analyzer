name: Validate Terraform

on:
  pull_request:
    paths:
      - "deploy-studio.json"
      - "infra/terraform/**"
      - "tests/test_deploy_studio_contract.py"
      - ".github/workflows/terraform.yml"
  push:
    branches:
      - main
    tags:
      - "v*"
    paths:
      - "deploy-studio.json"
      - "infra/terraform/**"
      - "tests/test_deploy_studio_contract.py"
      - ".github/workflows/terraform.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      TF_IN_AUTOMATION: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8

      - name: Validate Deploy Studio contract
        run: python -m unittest discover -s tests -p 'test_deploy_studio_contract.py' -v

      - name: Prepare synthetic credential placeholders
        shell: bash
        run: |
          mkdir -p infra/terraform/.oci
          printf '%s\n' '[DEFAULT]' 'region=us-chicago-1' 'key_file=.oci/key.pem' > infra/terraform/.oci/config
          printf '%s\n' 'synthetic-ci-placeholder' > infra/terraform/.oci/key.pem

      - name: Check Terraform formatting
        run: terraform fmt -check -recursive infra/terraform

      - name: Initialize Terraform
        run: terraform -chdir=infra/terraform init -backend=false -input=false

      - name: Validate Terraform
        run: terraform -chdir=infra/terraform validate
